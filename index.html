<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Le Mie Spese" />
  <meta name="theme-color" content="#0b1120" />
  <title>Le Mie Spese</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --teal: #0d9488;
      --teal-soft: #f0fdfa;
      --teal-border: #99f6e4;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --indigo: #4f46e5;
      --indigo-soft: #eef2ff;
      --danger: #ef4444;
      --border: #e2e8f0;
      --radius: 18px;
      --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body, input, select, textarea, button { font-family: "DM Sans", sans-serif; }
    h1, .card-title, .exec-val, .stat-value, .modal-title, .cal-month-title { font-family: "Outfit", sans-serif; }
    .num { font-variant-numeric: tabular-nums; }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: calc(88px + env(safe-area-inset-bottom));
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background:
        radial-gradient(circle at 12% 15%, rgba(13, 148, 136, 0.28), transparent 42%),
        radial-gradient(circle at 88% 10%, rgba(79, 70, 229, 0.25), transparent 45%),
        linear-gradient(165deg, #0b1120 0%, #111827 55%, #1e293b 100%);
      color: #f8fafc;
      padding: calc(16px + env(safe-area-inset-top)) 14px 22px;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      box-shadow: 0 12px 30px -6px rgba(11, 17, 32, 0.35);
    }

    .header-top {
      max-width: 800px;
      margin: 0 auto 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: linear-gradient(135deg, #2dd4bf, #6366f1);
      box-shadow: 0 0 10px rgba(45, 212, 191, 0.8);
    }

    .header-badges { display: flex; align-items: center; gap: 6px; }

    .pill-btn {
      font-size: 0.74rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .pill-btn.active { background: rgba(13, 148, 136, 0.9); border-color: #5eead4; color: #fff; }
    .pill-btn.cloud-ok { background: rgba(79, 70, 229, 0.85); border-color: #a5b4fc; color: #fff; }
    .pill-btn.cloud-err { background: rgba(239, 68, 68, 0.85); border-color: #fca5a5; color: #fff; }

    .today-badge {
      font-size: 0.74rem; font-weight: 600; background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.12); padding: 5px 10px;
      border-radius: 999px; color: #e2e8f0; white-space: nowrap;
    }

    .exec-grid { max-width: 800px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .exec-box {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s, background 0.15s;
    }
    .exec-box.clickable { cursor: pointer; }
    .exec-box.clickable:active { transform: scale(0.97); }
    .exec-box.bank-box {
      background: linear-gradient(145deg, rgba(20, 184, 166, 0.2), rgba(13, 148, 136, 0.08));
      border-color: rgba(94, 234, 212, 0.32);
      text-align: right;
    }

    .exec-label { font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #94a3b8; }
    .bank-box .exec-label { color: #5eead4; }
    .exec-val { font-size: 1.4rem; font-weight: 800; margin: 4px 0 2px; color: #ffffff; line-height: 1.1; }
    .exec-sub { font-size: 0.72rem; color: #cbd5e1; }

    @media (max-width: 480px) {
      .exec-grid { gap: 8px; }
      .exec-box { padding: 10px 12px; border-radius: 14px; }
      .exec-val { font-size: 1.24rem; }
    }

    main { max-width: 800px; margin: 16px auto 0; padding: 0 14px; }

    .tab-view { display: none; }
    .tab-view.active { display: block; animation: fadeSlide 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .card {
      background: var(--card); border-radius: var(--radius); padding: 16px;
      box-shadow: var(--shadow); margin-bottom: 14px; border: 1px solid var(--border);
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
    .card-title { font-size: 1rem; font-weight: 700; color: var(--text); }

    .btn-link { background: none; border: none; color: var(--teal); font-weight: 700; font-size: 0.83rem; cursor: pointer; padding: 4px 6px; border-radius: 8px; }
    .split-row { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 14px; align-items: stretch; }
    @media (max-width: 680px) { .split-row { grid-template-columns: 1fr; gap: 0; } }

    .quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 9px; }
    .quick-btn {
      background: linear-gradient(180deg, #ffffff 0%, var(--teal-soft) 100%);
      border: 1px solid var(--teal-border); border-radius: 14px; padding: 10px 6px;
      display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer;
    }
    .quick-btn:active { transform: scale(0.95); }
    .quick-icon { font-size: 1.4rem; margin-bottom: 3px; }
    .quick-name { font-size: 0.8rem; font-weight: 600; color: var(--text); word-break: break-word; }
    .quick-price { font-size: 0.78rem; font-weight: 700; color: var(--teal); margin-top: 2px; }

    .var-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
    .var-square {
      aspect-ratio: 1 / 1; background: linear-gradient(180deg, #ffffff 0%, var(--amber-soft) 100%);
      border: 1px solid var(--amber-border); border-radius: 16px; padding: 8px 6px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer;
    }
    .var-square:active { transform: scale(0.95); }
    .var-icon { font-size: 1.8rem; margin-bottom: 4px; }
    .var-name { font-size: 0.79rem; font-weight: 700; color: var(--text); line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .var-badge { margin-top: 5px; font-size: 0.69rem; font-weight: 700; color: #b45309; background: rgba(245, 158, 11, 0.16); padding: 2px 8px; border-radius: 999px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 0.75rem; font-weight: 600; color: var(--muted); }
    input, select, textarea {
      width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 11px;
      font-size: 16px; background: #f8fafc; color: var(--text); outline: none;
    }
    input:focus, select:focus, textarea:focus { background: #fff; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12); }

    .desc-icon-row { display: flex; gap: 8px; align-items: center; }
    .icon-select-mini { width: 68px; flex-shrink: 0; text-align: center; font-size: 1.15rem; padding: 7px 4px; }

    .btn-primary {
      width: 100%; background: linear-gradient(135deg, #0f172a, #1e293b); color: white; border: none;
      border-radius: 12px; padding: 12px; font-size: 0.94rem; font-weight: 700; cursor: pointer; margin-top: 12px;
    }
    .btn-primary:active { transform: scale(0.985); opacity: 0.92; }
    .btn-teal { background: linear-gradient(135deg, #0d9488, #0f766e); }
    .btn-indigo { background: linear-gradient(135deg, #4f46e5, #4338ca); }
    .btn-secondary { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }

    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .cal-month-title { font-weight: 700; font-size: 0.92rem; text-transform: capitalize; }
    .cal-nav-btn { background: #f1f5f9; border: 1px solid var(--border); border-radius: 9px; padding: 3px 10px; cursor: pointer; font-weight: 700; }
    .cal-weekdays, .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .cal-weekdays span { font-size: 0.7rem; font-weight: 700; color: var(--muted); padding-bottom: 4px; }
    .cal-day {
      aspect-ratio: 1 / 1; border-radius: 10px; border: 1px solid transparent; background: #f8fafc;
      display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 600; cursor: pointer; color: var(--text);
    }
    .cal-day.empty { background: transparent; cursor: default; }
    .cal-day.has-low { background: #f0fdfa; border-color: #ccfbf1; }
    .cal-day.has-med { background: #ccfbf1; border-color: #99f6e4; }
    .cal-day.has-high { background: #fef3c7; border-color: #fde68a; }
    .cal-day.is-today { box-shadow: inset 0 0 0 1.5px #0f172a; }
    .cal-day.selected { background: #0f172a !important; color: white !important; }
    .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--teal); margin-top: 1px; }
    .cal-day.has-high .cal-dot { background: var(--amber); }
    .cal-day.selected .cal-dot { background: #5eead4; }

    .expense-list { display: flex; flex-direction: column; gap: 8px; }
    .expense-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #f8fafc; border-radius: 14px; border: 1px solid var(--border); gap: 8px; }
    .expense-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .cat-emoji { width: 40px; height: 40px; border-radius: 12px; background: white; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; flex-shrink: 0; }
    .expense-info { min-width: 0; }
    .expense-desc { font-weight: 600; font-size: 0.91rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .expense-meta { font-size: 0.74rem; color: var(--muted); }
    .expense-loc { display: inline-block; margin-top: 2px; font-size: 0.72rem; color: var(--teal); text-decoration: none; font-weight: 600; }
    .expense-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .expense-amount { font-weight: 700; font-size: 0.95rem; }
    .btn-del { background: none; border: none; color: var(--muted); font-size: 1.05rem; cursor: pointer; padding: 5px 7px; border-radius: 8px; }
    .btn-del:hover { color: var(--danger); background: #fee2e2; }
    .empty-state { text-align: center; color: var(--muted); padding: 18px 10px; font-size: 0.86rem; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .stat-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
    .stat-box.bank-highlight { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #f0fdfa, #ecfdf5); border-color: var(--teal-border); }
    .stat-label { font-size: 0.75rem; color: var(--muted); font-weight: 600; }
    .stat-value { font-size: 1.32rem; font-weight: 800; margin-top: 3px; color: var(--text); }
    .chart-container { display: flex; align-items: flex-end; justify-content: space-between; height: 150px; gap: 6px; padding-top: 22px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
    .bar-val { font-size: 0.68rem; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
    .bar-fill { width: 100%; max-width: 34px; background: linear-gradient(180deg, #2dd4bf, #0d9488); border-radius: 8px 8px 4px 4px; min-height: 4px; transition: height 0.35s ease; }
    .bar-fill.zero { background: #e2e8f0; }
    .bar-label { font-size: 0.72rem; font-weight: 600; color: var(--muted); margin-top: 6px; }
    .cat-row { margin-bottom: 11px; }
    .cat-row:last-child { margin-bottom: 0; }
    .cat-row-top { display: flex; justify-content: space-between; font-size: 0.84rem; font-weight: 600; margin-bottom: 4px; }
    .progress-track { width: 100%; height: 8px; background: #f1f5f9; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #0d9488, #14b8a6); border-radius: 999px; }

    .doc-cats-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .doc-cat-pill { background: #f1f5f9; border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px; font-size: 0.84rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .doc-cat-pill.active { background: var(--indigo); border-color: var(--indigo); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }
    .doc-cat-pill .count-badge { background: rgba(15, 23, 42, 0.08); padding: 1px 7px; border-radius: 999px; font-size: 0.74rem; }
    .doc-cat-pill.active .count-badge { background: rgba(255, 255, 255, 0.22); }
    .doc-item { border: 1px solid var(--border); background: #f8fafc; border-radius: 14px; padding: 13px; margin-bottom: 10px; }
    .doc-item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .doc-title { font-weight: 700; font-size: 0.95rem; }
    .doc-meta { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .doc-notes { font-size: 0.82rem; color: #334155; margin-top: 6px; }
    .doc-file-bar { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #cbd5e1; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .doc-file-name { font-size: 0.78rem; font-weight: 600; color: var(--indigo); word-break: break-all; }
    .doc-file-actions { display: flex; gap: 6px; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(226, 232, 240, 0.8); display: flex; justify-content: space-around;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); z-index: 50;
    }
    .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 0.72rem; font-weight: 600; cursor: pointer; padding: 6px 14px; border-radius: 14px; }
    .nav-btn svg { width: 20px; height: 20px; stroke-width: 2; }
    .nav-btn.active { color: var(--text); background: #e2e8f0; font-weight: 700; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal-backdrop.open { display: flex; }
    .modal { background: white; border-radius: 22px; width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; padding: 18px; box-shadow: 0 24px 50px rgba(0, 0, 0, 0.25); }
    .manage-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border: 1px solid var(--border); border-radius: 11px; margin-bottom: 8px; }

    .toast {
      position: fixed; bottom: calc(82px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(20px);
      background: #0f172a; color: white; padding: 10px 16px; border-radius: 14px; font-size: 0.84rem; font-weight: 500;
      display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25); opacity: 0; pointer-events: none; transition: all 0.2s ease; z-index: 120; white-space: nowrap;
    }
    .toast.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    .toast-undo { background: none; border: none; color: #5eead4; font-weight: 700; cursor: pointer; font-size: 0.84rem; }
    .day-group-header { display: flex; justify-content: space-between; font-size: 0.84rem; font-weight: 700; color: var(--muted); margin: 14px 0 8px; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1><span class="brand-dot"></span> Le Mie Spese</h1>
      <div class="header-badges">
        <button class="pill-btn" id="syncBtn" title="Collega Google Fogli e Drive">☁️ Sync: Locale</button>
        <button class="pill-btn" id="gpsToggleBtn" title="Salva posizione GPS">📍 GPS: OFF</button>
        <span class="today-badge" id="headerDate"></span>
      </div>
    </div>

    <div class="exec-grid">
      <div class="exec-box">
        <div class="exec-label">Spese Oggi</div>
        <div class="exec-val num" id="heroTodayTotal">€ 0,00</div>
        <div class="exec-sub num" id="heroMonthSub">Mese: € 0,00</div>
      </div>

      <div class="exec-box bank-box clickable" id="openBankModalHeader" title="Tocca per gestire il saldo">
        <div class="exec-label">🏦 Saldo Banca</div>
        <div class="exec-val num" id="heroBankBalance">Impo
